name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Node only: scoring arithmetic, catalog consistency, docs checked against the code.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  # Breaks each probe on purpose: a refused reading scores as protection, so a broken probe
  # would raise the score. See the Limits section of METHODOLOGY.md.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm run test:browser
        env:
          PRIVACYASSAY_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

  # Repeated audits, re-entrant clicks, viewport extremes, and a server that 404s every helper.
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm run test:stress
        env:
          PRIVACYASSAY_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

# Not here: the seven-browser ranking. Tor and Mullvad cannot be installed on a hosted runner, and
# a job that skipped them would report green for a benchmark missing its two most important rows.
# That suite runs locally and its results are committed as a dated table.
