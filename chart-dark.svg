<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
<title id="title">Privacyassay 0.9.2: scoring weights</title>
<desc id="desc">32 readings in 13 categories. Base category weights sum to 21; all categories sum to 30. Judgment-based weights, not browser rankings or measured entropy.</desc>
<style>text{font-family:system-ui,sans-serif}</style>
<rect width="800" height="690" rx="16" fill="#0d1420"/>
<text x="28" y="42" fill="#eef3ff" font-size="25" font-weight="700">What contributes to the score</text>
<text x="28" y="72" fill="#a9b9d1" font-size="16">0.9.2 · 32 readings · category weight = its heaviest reading</text>
<text x="370" y="105" fill="#a9b9d1" font-size="14" text-anchor="middle">1</text>
<text x="500" y="105" fill="#a9b9d1" font-size="14" text-anchor="middle">2</text>
<text x="630" y="105" fill="#a9b9d1" font-size="14" text-anchor="middle">3</text>
<g data-group="gpu" data-weight="3" data-readings="7"><text x="28" y="139" fill="#eef3ff" font-size="17">Canvas &amp; GPU</text><rect x="240" y="120" width="390" height="25" rx="4" fill="#78adff"/><text x="642" y="139" fill="#a9b9d1" font-size="15">3 · 7 readings</text></g>
<g data-group="window" data-weight="3" data-readings="1"><text x="28" y="175" fill="#eef3ff" font-size="17">Window size</text><rect x="240" y="156" width="390" height="25" rx="4" fill="#78adff"/><text x="642" y="175" fill="#a9b9d1" font-size="15">3 · 1 reading</text></g>
<g data-group="fonts" data-weight="3" data-readings="3"><text x="28" y="211" fill="#eef3ff" font-size="17">Installed fonts</text><rect x="240" y="192" width="390" height="25" rx="4" fill="#78adff"/><text x="642" y="211" fill="#a9b9d1" font-size="15">3 · 3 readings</text></g>
<g data-group="network" data-weight="3" data-readings="1"><text x="28" y="247" fill="#eef3ff" font-size="17">WebRTC IP</text><rect x="240" y="228" width="390" height="25" rx="4" fill="#e6b754"/><text x="642" y="247" fill="#a9b9d1" font-size="15">3 · 1 reading</text></g>
<g data-group="extensions" data-weight="3" data-readings="1"><text x="28" y="283" fill="#eef3ff" font-size="17">Browser extensions</text><rect x="240" y="264" width="390" height="25" rx="4" fill="#e6b754"/><text x="642" y="283" fill="#a9b9d1" font-size="15">3 · 1 reading</text></g>
<g data-group="storage" data-weight="3" data-readings="1"><text x="28" y="319" fill="#eef3ff" font-size="17">Cross-site storage</text><rect x="240" y="300" width="390" height="25" rx="4" fill="#e6b754"/><text x="642" y="319" fill="#a9b9d1" font-size="15">3 · 1 reading</text></g>
<g data-group="layout" data-weight="2" data-readings="3"><text x="28" y="355" fill="#eef3ff" font-size="17">Layout &amp; text metrics</text><rect x="240" y="336" width="260" height="25" rx="4" fill="#78adff"/><text x="512" y="355" fill="#a9b9d1" font-size="15">2 · 3 readings</text></g>
<g data-group="display" data-weight="2" data-readings="4"><text x="28" y="391" fill="#eef3ff" font-size="17">Screen &amp; display</text><rect x="240" y="372" width="260" height="25" rx="4" fill="#78adff"/><text x="512" y="391" fill="#a9b9d1" font-size="15">2 · 4 readings</text></g>
<g data-group="media" data-weight="2" data-readings="2"><text x="28" y="427" fill="#eef3ff" font-size="17">Media &amp; voices</text><rect x="240" y="408" width="260" height="25" rx="4" fill="#78adff"/><text x="512" y="427" fill="#a9b9d1" font-size="15">2 · 2 readings</text></g>
<g data-group="audio" data-weight="2" data-readings="2"><text x="28" y="463" fill="#eef3ff" font-size="17">Audio fingerprint</text><rect x="240" y="444" width="260" height="25" rx="4" fill="#78adff"/><text x="512" y="463" fill="#a9b9d1" font-size="15">2 · 2 readings</text></g>
<g data-group="os" data-weight="2" data-readings="3"><text x="28" y="499" fill="#eef3ff" font-size="17">Operating system</text><rect x="240" y="480" width="260" height="25" rx="4" fill="#78adff"/><text x="512" y="499" fill="#a9b9d1" font-size="15">2 · 3 readings</text></g>
<g data-group="locale" data-weight="1" data-readings="2"><text x="28" y="535" fill="#eef3ff" font-size="17">Timezone &amp; language</text><rect x="240" y="516" width="130" height="25" rx="4" fill="#78adff"/><text x="382" y="535" fill="#a9b9d1" font-size="15">1 · 2 readings</text></g>
<g data-group="hardware" data-weight="1" data-readings="2"><text x="28" y="571" fill="#eef3ff" font-size="17">CPU &amp; memory</text><rect x="240" y="552" width="130" height="25" rx="4" fill="#78adff"/><text x="382" y="571" fill="#a9b9d1" font-size="15">1 · 2 readings</text></g>
<text x="28" y="618" fill="#e6b754" font-size="15">Gold: WebRTC/storage opt-ins; extension evidence counts only when detected.</text>
<text x="28" y="645" fill="#a9b9d1" font-size="15">Base denominator 21; maximum 30. Unknown readings earn no protection credit.</text>
<text x="28" y="671" fill="#a9b9d1" font-size="15">These weights express judgment. They are not tracking probabilities.</text>
</svg>
